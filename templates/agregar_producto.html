<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargar Producto - El Mana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: linear-gradient(rgba(244, 246, 249, 0.4), rgba(244, 246, 249, 0.4)), 
                              url('/static/campo.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background-color: #e67e22;
        }
        .formulario-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background-color: rgba(255, 255, 255, 0.98);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-custom mb-5 shadow-sm py-3">
        <div class="container justify-content-between">
            <span class="navbar-brand fw-bold fs-2">🏪 Panel de Carga - El Mana</span>
            <a href="{{ url_for('listar_productos_admin') }}" class="btn btn-outline-light fw-bold">← Volver al Listado</a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                
                <div class="card formulario-card p-4">
                    <h3 class="fw-bold text-center text-dark mb-4">➕ Registrar Nueva Mercadería</h3>
                    
                    <form action="/agregar-producto" method="POST" enctype="multipart/form-data">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">Nombre del Producto</label>
                            <input type="text" name="nombre" class="form-control" placeholder="Ej: Aceite de 5L" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">Descripción del Producto (Opcional)</label>
                            <textarea name="descripcion" class="form-control" rows="3" placeholder="Ej: Aceite comestible x 5 Litros, ideal para cocina o comercio."></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold text-dark">Precio ($)</label>
                                <input type="number" name="precio" class="form-control" placeholder="Ej: 11500" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold text-dark">Stock Inicial</label>
                                <input type="number" name="stock" class="form-control" placeholder="Ej: 15" required>
                            </div>
                        </div>

                        <!-- Sección de Configuración de Medio Pack -->
                        <div class="card bg-light p-3 mb-3 border-0">
                            <h6 class="fw-bold text-dark mb-2">⚙️ Configuración de Medio Pack</h6>
                            <div class="mb-2">
                                <label class="form-label small fw-bold text-muted">¿Permite venta de Medio Pack?</label>
                                <select name="permite_medio_pack" class="form-select form-select-sm">
                                    <option value="0" selected>No (Solo pack/entero)</option>
                                    <option value="1">Sí (Habilitar opción de mitad)</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label small fw-bold text-muted">Nombre de la unidad (Ej: Bolsa, Pack, Caja, Fardito)</label>
                                <input type="text" name="nombre_unidad" class="form-control form-control-sm" placeholder="Ej: Bolsa">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">Sabores / Variantes (Separados por coma - Opcional)</label>
                            <input type="text" name="sabores" class="form-control" placeholder="Ej: Cola, Naranja, Pomelo">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">Foto del Producto (Subir tu foto editada)</label>
                            <input type="file" name="imagen" class="form-control" accept="image/*">
                            <small class="text-muted">Si no seleccionás ninguna foto, se asignará la imagen por defecto automáticamente.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">Departamento / Sector Principal</label>
                            <select name="departamento" class="form-select">
                                <option value="Mercaderia">🛒 Mercadería</option>
                                <option value="Forrajeria">🌾 Forrajería</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark">Sección / Categoría (Escribila libremente)</label>
                            <input type="text" name="categoria" class="form-control" placeholder="Ej: Harinas, Pastas, Enlatados, Bebidas, etc." required>
                            <small class="text-muted">Podés escribir la categoría que quieras para organizar tus productos.</small>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning btn-lg fw-bold text-dark p-3 shadow-sm">
                                💾 Guardar Producto
                            </button>
                            <a href="{{ url_for('listar_productos_admin') }}" class="btn btn-outline-secondary mt-2">
                                ❌ Cancelar y Volver
                            </a>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

</body>
</html>

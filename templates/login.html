<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al Panel - El Mana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: linear-gradient(rgba(244, 246, 249, 0.4), rgba(244, 246, 249, 0.4)), 
                              url('/static/campo.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
       .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background-color: rgba(255, 255, 255, 0.98);
        }
       .navbar-custom {
            background-color: #e67e22;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-custom mb-5 shadow-sm py-3">
        <div class="container justify-content-center">
            <span class="navbar-brand fw-bold fs-2">🔒 Panel Administrativo - El Mana</span>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="card login-card p-4 text-center">
                    <img src="{{ url_for('static', filename='logo.npg.jpeg') }}" 
                         alt="Logo El Mana" 
                         class="rounded-circle shadow mx-auto mb-3" 
                         style="width: 100px; height: 100px; object-fit: cover; border: 3px solid white;">
                    
                    <h3 class="fw-bold text-dark mb-4">Iniciar Sesión</h3>
                    
                    {% if error %}
                        <div class="alert alert-danger p-2 small" role="alert">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form action="/login" method="POST">
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold text-muted small">Usuario</label>
                            <input type="text" name="usuario" class="form-control" placeholder="Escribe tu usuario" required>
                        </div>
                        
                        <div class="mb-4 text-start">
                            <label class="form-label fw-bold text-muted small">Contraseña</label>
                            <input type="password" name="contrasena" class="form-control" placeholder="Escribe tu clave" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning fw-bold text-dark p-3 rounded-pill shadow-sm">
                                🔑 Ingresar
                            </button>
                            <a href="/" class="btn btn-link text-decoration-none text-muted small mt-2">
                                ↩️ Volver al Catálogo
                            </a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

</body>
</html>

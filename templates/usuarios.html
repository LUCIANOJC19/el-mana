<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - El Maná</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fa-solid fa-users-gear text-primary"></i> Gestión de Usuarios Administradores</h2>
            <a href="{{ url_for('admin') }}" class="btn btn-secondary">
                <i class="fa-solid fa-arrow-left"></i> Volver al Panel
            </a>
        </div>

        <div class="row">
            <!-- Formulario para agregar nuevo usuario -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h4 class="card-title mb-3"><i class="fa-solid fa-user-plus"></i> Nuevo Usuario</h4>
                        <form action="{{ url_for('gestionar_usuarios') }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre de Usuario:</label>
                                <input type="text" class="form-control" name="usuario" required placeholder="Ej. hermano, empleado">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Contraseña:</label>
                                <input type="password" class="form-control" name="contrasena" required placeholder="Contraseña segura">
                            </div>
                            <button type="submit" class="btn btn-success w-100">
                                <i class="fa-solid fa-check"></i> Registrar Usuario
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Listado de usuarios actuales -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h4 class="card-title mb-3"><i class="fa-solid fa-list"></i> Usuarios con Acceso</h4>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Usuario</th>
                                        <th class="text-end">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for u in usuarios %}
                                    <tr>
                                        <td>{{ u.0 }}</td>
                                        <td class="fw-bold">{{ u.1 }}</td>
                                        <td class="text-end">
                                            <a href="{{ url_for('eliminar_usuario', id_user=u.0) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro de eliminar este usuario?');">
                                                <i class="fa-solid fa-trash"></i> Eliminar
                                            </a>
                                        </td>
                                    </tr>
                                    {% else %}
                                    <tr>
                                        <td colspan="3" class="text-center text-muted">No hay usuarios registrados.</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
